agents:
  executive: [aitunnel, groq, gemini, ollama]
  brief: [aitunnel, groq, gemini, ollama]
  developer: [aitunnel, groq, cloudflare, openrouter, ollama]
  self_upgrade: [aitunnel, groq, gemini, ollama]
  branding: [aitunnel, groq, gemini, ollama]
  media: [aitunnel, groq, cloudflare, openrouter, ollama]

ollama_models:
  executive: qwen2.5-coder:3b
  brief: qwen2.5-coder:3b
  developer: qwen2.5-coder:3b
  self_upgrade: qwen2.5-coder:3b
  branding: qwen2.5-coder:3b
  media: qwen2.5-coder:3b

providers:
  aitunnel:
    model: deepseek-v4-flash-0731
    base_url: https://api.aitunnel.ru/v1/
    api_key_env: AITUNNEL_API_KEY
    timeout: 30
  groq:
    model: llama-3.3-70b-versatile
    timeout: 15
  gemini:
    model: gemini-2.5-flash
    timeout: 30
  openrouter:
    model: google/gemini-2.5-flash:free
    timeout: 30
  cloudflare:
    model: "@cf/meta/llama-3.1-8b-instruct"
    timeout: 20
  ollama:
    model_3b: qwen2.5-coder:3b
    model_7b: qwen2.5-coder:7b
    timeout: 60